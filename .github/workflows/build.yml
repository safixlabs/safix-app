name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # The release ties uploaded source maps to the events the app reports.
          NEXT_PUBLIC_RELEASE: ${{ github.sha }}
          # Absent on forks and on pull requests from them; the build still
          # succeeds and the maps are deleted either way.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

  contrast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/contrast.mjs

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # Uploaded on success as well, so the Linux baselines a first run writes
      # can be pulled down and committed.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-snapshots
          path: e2e/**/*-snapshots/**
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  money-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # anvil forks the public testnet, so the contracts under test are the ones
      # really deployed there. No deploy step, and nothing secret in CI.
      - uses: foundry-rs/foundry-toolchain@v1
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:live
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: money-paths-report
          path: playwright-report/
          retention-days: 7
